# SonarQube Project Configuration for Statistics Story AI
# Conforming to SKPL/SRS & Contract Quality Baseline

sonar.projectKey=statistics-story-ai
sonar.projectName=Statistics Story AI
sonar.projectVersion=1.0.0

# Source & Test paths analyzed by SonarQube
sonar.sources=app,src,server,database
sonar.tests=tests
sonar.test.inclusions=tests/**/*.ts,tests/**/*.tsx

# Encoding
sonar.sourceEncoding=UTF-8

# Excluded paths: dependencies, build outputs, generated artifacts, and documentation
sonar.exclusions=**/node_modules/**,**/dist/**,**/.next/**,**/public/**,**/coverage/**,**/docs/**,**/*.d.ts,pnpm-lock.yaml,biome.json,sonar-project.properties

# Test coverage integration
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# TypeScript configuration reference
sonar.typescript.tsconfigPath=tsconfig.json

# Environment configurations
sonar.javascript.environments=browser,node

# Quality gate settings: wait for Quality Gate in CI pipeline to fail/block if criteria not met
sonar.qualitygate.wait=true
